<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Pendaftaran</title>
</head>
<body>
    <h2>Form Pendaftaran</h2>
    <form>
        <table>
            <tr>
                <td><label>Nama Lengkap</label></td>
                <td>: </td>
                <td><input type="text" required /></td>
            </tr>
            <tr>
                <td><label>No HP</label></td>
                <td>: </td>
                <td><input type="number" required placeholder="Masukkan No HP" /></td>
            </tr>
            <tr>
                <td><label>Email</label></td>
                <td>: </td>
                <td><input type="email" required placeholder="Masukkan Email" /></td>
            </tr>
            <tr>
                <td><label>Password</label></td>
                <td>: </td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td><label>Tanggal Lahir</label></td>
                <td>: </td>
                <td><input type="date"/></td>
            </tr>
            <tr>
                <td><label>Jenis Kelamin</label></td>
                <td>: </td>
                <td>
                    <input type="radio" name="Jenis Kelamin" value="Laki-laki" /> Laki-laki
                    <input type="radio" name="Jenis Kelamin" value="Perempuan" /> Perempuan
                </td>
            </tr>
            <tr>
                <td><label>Hobi</label></td>
                <td>: </td>
                <td>
                    <input type="checkbox" name="Hobi" value="Membaca" /> Membaca
                    <input type="checkbox" name="Hobi" value="Menulis" /> Menulis
                    <input type="checkbox" name="Hobi" value="Bermain Game" /> Bermain Game
                    <input type="checkbox" name="Hobi" value="Bersepeda" /> Bersepeda
                </td>
            </tr>
            <tr>
                <td><label>Alamat</label></td>
                <td>: </td>
                <td><textarea name="Alamat" placeholder="Masukkan Alamat"></textarea></td>
            </tr>
            <tr>
                <td><label>Jurusan</label></td>
                <td>: </td>
                <td>
                    <select name="Jurusan">
                        <option value="RPL">RPL</option>
                        <option value="TKJ">TKJ</option>
                        <option value="PG">PG</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Foto</label></td>
                <td>: </td>
                <td><input type="file" name="Foto" /></td>
            </tr>
            <tr>
                <td colspan="3"align="center">
                    <input type="submit" value="Submit" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
